<svg xmlns="http://www.w3.org/2000/svg" width="920" height="548" viewBox="0 0 920 548" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="548" fill="#ffffff"/>

  <!-- Title -->
  <text x="44" y="40" font-size="22" font-weight="700" fill="#0f172a">DPE Call Sequence — DeriveContext / CertifyKey</text>

  <!-- Phase bands -->
  <rect x="40" y="128" width="840" height="118" rx="10" fill="#eff6ff" opacity="0.6"/>
  <rect x="40" y="296" width="840" height="150" rx="10" fill="#f0fdfa" opacity="0.7"/>
  <text x="52" y="148" font-size="12.5" font-weight="700" fill="#2563eb">① Extend context</text>
  <text x="52" y="316" font-size="12.5" font-weight="700" fill="#0d9488">② Issue key certificate</text>

  <!-- Actor boxes -->
  <rect x="80" y="58" width="240" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="82" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">Client</text>
  <text x="200" y="101" font-size="12.5" font-weight="600" fill="#3b82f6" text-anchor="middle">TF-A (Host)</text>

  <rect x="510" y="58" width="300" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="660" y="82" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">DPE Service (isolated partition)</text>
  <text x="660" y="101" font-size="12.5" font-weight="600" fill="#14b8a6" text-anchor="middle">TF-M (DPE Secure Partition)</text>

  <!-- Lifelines -->
  <line x1="200" y1="114" x2="200" y2="470" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="660" y1="114" x2="660" y2="470" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Activation bars -->
  <rect x="654" y="150" width="12" height="86" fill="#5eead4" stroke="#0d9488" stroke-width="1"/>
  <rect x="654" y="320" width="12" height="108" fill="#5eead4" stroke="#0d9488" stroke-width="1"/>

  <!-- ===== Phase 1: DeriveContext ===== -->
  <!-- command arrow -->
  <line x1="200" y1="155" x2="652" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#cmd)"/>
  <text x="426" y="148" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle">DeriveContext(handle_in, measurement/TCI, flags)</text>

  <!-- internal box -->
  <rect x="500" y="166" width="320" height="44" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="660" y="184" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="middle">[internal] derive child CDI from measurement</text>
  <text x="660" y="201" font-size="10.5" fill="#0f766e" text-anchor="middle">→ creates a new context · key/CDI never exposed</text>

  <!-- return arrow -->
  <line x1="652" y1="232" x2="204" y2="232" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="426" y="225" font-size="13" font-weight="600" fill="#0f766e" text-anchor="middle">returns a new opaque handle (handle_out)</text>

  <!-- ===== Phase 2: CertifyKey ===== -->
  <line x1="200" y1="325" x2="652" y2="325" stroke="#334155" stroke-width="2" marker-end="url(#cmd)"/>
  <text x="426" y="318" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle">CertifyKey(handle, [pub_key], label, format)</text>

  <rect x="512" y="336" width="296" height="70" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="660" y="356" font-size="12.5" font-weight="600" fill="#0f766e" text-anchor="middle">[internal] derive attestation keypair from CDI</text>
  <text x="660" y="374" font-size="12.5" font-weight="600" fill="#0f766e" text-anchor="middle">generate leaf certificate</text>
  <text x="660" y="392" font-size="11.5" fill="#0f766e" text-anchor="middle">→ signed with the parent layer's private key</text>

  <line x1="652" y1="424" x2="204" y2="424" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="426" y="417" font-size="13" font-weight="600" fill="#0f766e" text-anchor="middle">returns leaf cert + cert chain (+ new handle)</text>

  <!-- Trust boundary caption near lifeline -->
  <text x="660" y="462" font-size="11" fill="#64748b" text-anchor="middle">↑ trust boundary</text>

  <!-- Footer notes -->
  <line x1="44" y1="498" x2="876" y2="498" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="524" font-size="12.5" fill="#475569">※ Only <tspan font-weight="700" fill="#0f766e">opaque handles and certificates</tspan> cross the boundary — CDI and private keys never leave the partition</text>
</svg>
